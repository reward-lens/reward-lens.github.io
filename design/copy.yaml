# Every string on the site. Nothing is typed twice: page titles, preview images,
# structured data and the pages themselves all render from this file.
#
# Rules enforced against this file by CI:
#   - no em dashes anywhere
#   - no banned internal identifier (data/banned-terms.json, ~620 strings)
#   - no hype vocabulary (the list in QA.md §6.2)
#   - every quantitative claim carries its scope in the same string as the number
#   - every numeric token is bound to an evidence id or allow-listed with a reason
#
# `ev:` values are evidence ids. `{{...}}` is a value rendered from generated data
# and must never be typed as a literal here.

meta:
  site_name: reward-lens
  tagline: Instruments for the gap between the reward you wrote down and the objective your policy moved toward.
  author: Mohammed Suhail B Nadaf
  licence: MIT

urls:
  site: https://reward-lens.github.io/
  repo: https://github.com/reward-lens/reward-lens
  docs: https://reward-lens.github.io/docs/
  pypi: https://pypi.org/project/reward-lens/
  preprint: https://arxiv.org/abs/2604.26130
  issues: https://github.com/reward-lens/reward-lens/issues

# ---------------------------------------------------------------------------
# NAVIGATION
# Added at build time. Every label here is user-facing and had no source, which
# would have forced F1 to invent six strings on its first afternoon.
#
# Six items in the primary nav and no more. `/limits/` is in it deliberately:
# for this audience a stated limitation is a feature, and burying it in the
# footer would be the one placement that reads as hiding it.
#
# The footer carries four route groups rather than a link dump. The grouping is
# by what a reader came to do: watch it work, use it, check it, or judge the
# project. `/evidence/` sits under "Check" and not under "Use", because it is
# the route that makes every other number believable.
# ---------------------------------------------------------------------------
